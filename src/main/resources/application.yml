spring:
  application:
    name: SmartLink

  config:
    import: "optional:file:.env[.properties]"

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  link-creation:
    company-endpoint: ${COMPANY_ENDPOINT}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM}
      sasl.jaas.config: ${KAFKA_JAAS_CONFIG}
      session.timeout.ms: ${KAFKA_SESSION_TIMEOUT}

    producer:
      key-serializer: ${KAFKA_KEY_SERIALIZER}
      value-serializer: ${KAFKA_VALUE_SERIALIZER}
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID}
      key-deserializer: ${KAFKA_KEY_DESERIALIZER}
      value-deserializer: ${KAFKA_VALUE_DESERIALIZER}
      properties:
        spring.json.trusted.packages: com.spring.springboot.smartlink.model
        spring.json.use.type.headers: false

virustotal:
  api-key: ${VT_API_KEY}
  analysis-url: ${VT_ANALYSIS_URL}

sendgrid:
  api_key: ${SENDGRID_API_KEY}
  verified:
    senders:
      email: ${SENDGRID_EMAIL}

ipinfo:
  token: ${IP_INFO_TOKEN}

jwt:
  secretKey: ${JWT_SECRET_KEY}

logging:
  level:
    org.apache.kafka: WARN
    org.springframework.kafka: WARN
