<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>SmartLink — Redirecting</title>
    <meta charset="UTF-8">

    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card centered">
            <span class="brand-mark warning-icon">S</span>
            <h2>Taking you there…</h2>
            <p class="warning-copy">We’re recording this click and checking the destination.</p>
        </div>
    </div>

    <script th:inline="javascript">
        (function () {

            /* Thymeleaf injected values */
            const shortHash = /*[[${shortCode}]]*/ '';
            const longUrl = /*[[${longUrl}]]*/ '';

            /* Safety check */
            if (!longUrl) {
                console.error("Redirect failed: longUrl is empty");
                return;
            }

            /* Tracking payload */
            const payload = {
                shortHash: shortHash,

                screenWidth: window.screen.width,

                viewportWidth: window.innerWidth,

                userAgent: navigator.userAgent,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };

            /* Fire-and-forget tracking */
            fetch("/api/track", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload),
                keepalive: true
            })
                .catch(err => console.error("Tracking failed", err))
                .finally(() => {
                    /* Guaranteed redirect */
                    window.location.replace(longUrl);
                });

        })();
    </script>

</body>

</html>
