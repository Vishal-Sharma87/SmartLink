<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('SmartLink — Verify signup')}"></head>
<body>
<div th:replace="~{fragments/navbar-public :: navbar-public}"></div>
<main class="container narrow-layout">
    <section class="panel-stack">
        <p class="kicker">SIGNUP VERIFICATION</p>
        <h1>Confirm your email.</h1>
        <p class="lede">Enter the six-digit code sent to <strong class="verification-email" th:text="${pendingEmail}">your email address</strong>.</p>
        <div th:replace="~{fragments/alerts :: alert}"></div>
        <form class="form-stack" action="/auth/signup/verify" method="post" data-signup-verification-form>
            <label>Verification code<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required data-otp-input aria-describedby="otp-help"></label>
            <p id="otp-help" class="form-note">Use the six digits from the email.</p>
            <button class="button button-primary" type="submit">Verify account</button>
        </form>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script defer th:src="@{/js/signup.js}"></script>
</body>
</html>
