<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('SmartLink — Log in')}"></head>
<body>
<div th:replace="~{fragments/navbar-public :: navbar-public}"></div>
<main class="container auth-layout">
    <section class="auth-intro">
        <p class="kicker">ACCOUNT ACCESS</p>
        <h1>Welcome back.</h1>
        <p class="lede">Sign in to manage your SmartLinks and understand the activity recorded for links you own.</p>
    </section>
    <section class="auth-panel panel-stack">
        <p class="kicker">LOG IN</p>
        <h2>Access your workspace.</h2>
        <div th:replace="~{fragments/alerts :: alert}"></div>
        <form class="form-stack" action="/auth/login" method="post" aria-label="Log in form" data-login-form>
            <label for="login-email">Email
                <input id="login-email" name="email" type="email" autocomplete="email" maxlength="254" required>
            </label>
            <label for="login-password">Password
                <input id="login-password" name="password" type="password" autocomplete="current-password" maxlength="128" minlength="6" required data-password-input>
            </label>
            <button class="button button-primary" type="submit">Log in</button>
        </form>
        <p class="auth-switch">Don’t have an account? <a th:href="@{/signup}">Sign up</a></p>
    </section>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script defer th:src="@{/js/login.js}"></script>
</body>
</html>
