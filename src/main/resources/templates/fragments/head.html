<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171820">
    <meta name="color-scheme" content="dark">
    <title th:text="${title}">SmartLink</title>
    <link rel="icon" type="image/svg+xml" sizes="any" th:href="@{/icons/favicon.svg(v=1)}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:inline="javascript">
        window.SmartLinkConfig = {
            domain: /*[[${companyDomain}]]*/ '',
            endpoint: /*[[${companyEndpoint}]]*/ ''
        };
    </script>
    <script defer th:src="@{/js/foundation.js}"></script>
    <script defer th:src="@{/js/authenticated-request.js}"></script>
</head>
</html>
