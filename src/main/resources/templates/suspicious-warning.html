<!DOCTYPE html>
<html xmlns:th="http://www.w3.org/1999/xhtml">

<head>
    <title>SmartLink — Review destination</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body class="auth-page">
    <div class="auth-shell">
        <div class="auth-card centered warning-card">
            <span class="feature-icon orange warning-icon">!</span>
            <h2>Review this destination</h2>
            <p class="warning-copy">This link looks suspicious or has not been fully verified. Continue only if you
                recognize and trust the destination.</p>
            <div class="detail-item"><small>Destination URL</small><strong th:text="${longUrl}"></strong></div>
            <button class="button button-primary button-wide" id="proceedBtn">Proceed anyway</button>
            <a class="button button-ghost button-wide" href="/">Go back</a>
        </div>
    </div>

    <script th:inline="javascript">
        const shortCode = /*[[${shortCode}]]*/ '';
        document.getElementById("proceedBtn").addEventListener("click", () => {
            window.location.href = `/api/confirm/${shortCode}`;
        });
    </script>

</body>

</html>
