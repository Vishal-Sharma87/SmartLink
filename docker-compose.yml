services:
  nginx:
    image: "nginx:alpine"
    container_name: "smart-link-nginx"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      application:
        condition: service_started
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf

  application:
    build: .
    container_name: "smart-link"

    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  mongodb:
    image: "mongo:${MONGODB_IMAGE_TAG}"
    container_name: "smart-link-mongodb"
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: "${MONGODB_DATABASE}"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - "smartlink_mongodb-data:/data/db"

  redis:
    image: "redis:${REDIS_IMAGE_TAG}"
    container_name: "smart-link-redis"
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    volumes:
      - "smartlink_redis-data:/data"

  kafka:
    image: "apache/kafka:${KAFKA_IMAGE_TAG}"
    container_name: "smart-link-kafka"
    restart: unless-stopped
    environment:
      KAFKA_CLUSTER_ID: "619f0c47-8d45-444a-90f0-a6360586a97b"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_ADVERTISED_HOST}:${KAFKA_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - "smartlink_kafka-data:/var/lib/kafka/data"

volumes:
  smartlink_mongodb-data:
  smartlink_redis-data:
  smartlink_kafka-data:
