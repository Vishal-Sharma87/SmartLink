services:
  mongodb:
    image: "mongo:${MONGODB_IMAGE_TAG}"
    container_name: "smart-link-mongodb"
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT}:27017"
    environment:
      MONGO_INITDB_DATABASE: "${MONGODB_DATABASE}"
    volumes:
      - "smartlink_mongodb-data:/data/db"

  redis:
    image: "redis:${REDIS_IMAGE_TAG}"
    container_name: "smart-link-redis"
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - "smartlink_redis-data:/data"

  kafka:
    image: "apache/kafka:${KAFKA_IMAGE_TAG}"
    container_name: "smart-link-kafka"
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_CLUSTER_ID: "619f0c47-8d45-444a-90f0-a6360586a97b"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${KAFKA_ADVERTISED_HOST}:${KAFKA_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"

      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - "smartlink_kafka-data:/var/lib/kafka/data"

volumes:
  smartlink_mongodb-data:
  smartlink_redis-data:
  smartlink_kafka-data: