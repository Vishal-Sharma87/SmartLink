# Maven Wrapper configuration
# Defines the Maven version and distribution used by the project.

# Version of the Maven Wrapper scripts.
wrapperVersion=3.3.4

# Download only the Maven startup script instead of the full wrapper distribution.
distributionType=only-script

# Maven distribution to download and use for this project.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.zip